owner: trevordixon
repo: serveo-status

sites:
  - name: Website
    url: https://serveo.net/
  - name: Console API
    url: https://console.serveo.net/api/health
    __dangerous__body_down_if_text_missing: '"code":200'
  - name: SSH tunnels
    check: tcp-ping
    url: serveo.net
    port: 22
  - name: SSH over HTTPS
    check: tcp-ping
    url: serveo.net
    port: 443

status-website:
  baseUrl: /serveo-status
  logoUrl: https://serveo.net/favicon.svg
  name: Serveo Status
  introTitle: "Serveo service status"
  introMessage: Current availability and incident history for Serveo's public tunneling services.
  navbar:
    - title: Status
      href: /serveo-status
    - title: Serveo
      href: https://serveo.net/
    - title: Documentation
      href: https://serveo.net/docs/

skipDeleteIssues: true

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
